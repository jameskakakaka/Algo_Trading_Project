[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-lsm-research"
version = "0.1.0"
description = "Offline-first finalized-bar ingestion, LSM recovery and reproducible research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kafka = ["kafka-python==2.3.3"]
ml = ["numpy==2.2.6", "scikit-learn==1.7.2", "xgboost==3.4.1"]
legacy = ["requests==2.32.5", "pandas==2.3.3", "ta==0.11.0", "joblib==1.5.2"]

[tool.setuptools.packages.find]
include = ["schemas*", "ingestion*", "streaming*", "storage_engine*", "ai_op*", "execution_engine*", "tools*"]
